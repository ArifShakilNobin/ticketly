server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 25s
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins: "${CORS_ALLOWED_ORIGINS:*}"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: false
            max-age: 3600
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**

        - id: voice-nlp-service
          uri: ${VOICE_NLP_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/nlp/**

        - id: aggregator-service
          uri: ${AGGREGATOR_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/search/**

        - id: cost-optimization-service
          uri: ${COST_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/offers/**

        - id: booking-payment-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/bookings/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/notifications/**

ticketly:
  security:
    jwt:
      secret: ${JWT_SECRET:ticketly-dev-secret-key-change-me-32-characters-min}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

gateway:
  security:
    enabled: ${GATEWAY_SECURITY_ENABLED:true}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    burst-capacity: ${GATEWAY_RATE_BURST:100}
    refill-per-minute: ${GATEWAY_RATE_REFILL:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
