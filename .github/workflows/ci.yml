name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Unit tests + package
        run: mvn -B -ntp verify

      - name: Compose config sanity check
        run: docker compose config -q

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyse
        working-directory: mobile
        run: flutter analyze

      - name: Unit tests
        working-directory: mobile
        run: flutter test
